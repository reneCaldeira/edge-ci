name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # This repository is public: do not run untrusted fork PR code on the Shared host.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, auronico-shared]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: |
          (cd deploy && python3 -m unittest -v test_edge_deploy)
          python3 -m py_compile quality/*.py opengrep/*.py deploy/*.py
          bash -n deploy/install.sh
